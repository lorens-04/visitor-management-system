<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="container container-wide">
        <header class="page-header">
            <div>
                <h1>Tracker Dashboard</h1>
                <p class="muted" id="roleHint">Monitor visitors and routes</p>
            </div>
            <nav class="header-actions">
                <a class="link-button" href="security_scan.html">Scan QR</a>
                <a class="link-button" id="adminLink" href="admin.html" hidden>Admin</a>
                <button type="button" id="logoutBtn" class="button-secondary">Sign out</button>
            </nav>
        </header>

        <div class="controls">
            <label for="visitorSelect">Visitor:</label>
            <select id="visitorSelect">
                <option value="">Select Visitor</option>
            </select>

            <label for="visitDate">Date:</label>
            <select id="visitDate">
                <option value="">Select Date</option>
            </select>

            <button id="applyFiltersBtn">Apply Filters</button>
        </div>

        <section class="panel">
            <h2>Active Visits</h2>
            <p class="muted small">Security can end a visit to stop tracking and mark the appointment as complete.</p>
            <p class="muted small">
                <span class="status-badge status-active">Active</span>
                <span class="status-badge status-pending">Not Active</span>
                <span class="status-badge status-completed">Completed</span>
            </p>
            <div id="activeVisitsList" class="appointments-list"></div>
        </section>

        <div class="status-box">
            <p><strong>Device:</strong> <span id="device">-</span></p>
            <p><strong>Selected Date:</strong> <span id="selectedDate">-</span></p>
            <p><strong>Start Point:</strong> <span id="startCoords">-</span></p>
            <p><strong>Start Time:</strong> <span id="startTime">-</span></p>
            <p><strong>End Point:</strong> <span id="endCoords">-</span></p>
            <p><strong>End Time:</strong> <span id="endTime">-</span></p>
        </div>

        <div id="map"></div>
    </div>

    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
